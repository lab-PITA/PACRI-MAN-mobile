// 12. PLAYER CLASS (プレイヤー制御、足音システムの実装)
// ----------------------------------------------------------------------------
class Player {
    constructor(maze) {
        this.maze = maze;
        this.x = maze.spawnPoint.x * GAME_CONFIG.TILE_SIZE + GAME_CONFIG.TILE_SIZE / 2;
        this.y = maze.spawnPoint.y * GAME_CONFIG.TILE_SIZE + GAME_CONFIG.TILE_SIZE / 2;
        this.z = GAME_CONFIG.TILE_SIZE / 2;
        
        this.angle = 0;           
        this.targetAngle = 0;     
        this.speed = GAME_CONFIG.PLAYER_SPEED;
        
        this.isMoving = false;
        this.makingNoise = false; 
        
        this.score = 0;
        this.lives = 3;
        this.dotsEaten = 0;
        this.headBobTimer = 0;
    }

    update(dt, inputMgr, particles) {
        this._handleRotation(dt, inputMgr);
        this._handleMovement(dt, inputMgr);
        this._applyHeadBob(dt);
        this._checkItemCollisions(particles);
    }

          _handleRotation(dt, inputMgr) {
        // ボタン入力をチェックしてターゲット角度を90度ずつずらす
        if (inputMgr.turnLeftTrigger) {
            this.targetAngle -= Math.PI / 2;
            inputMgr.turnLeftTrigger = false; // 消費
            if(typeof audio !== 'undefined') audio.playTone(400, 'sine', 0.05, 0.1);
        }
        if (inputMgr.turnRightTrigger) {
            this.targetAngle += Math.PI / 2;
            inputMgr.turnRightTrigger = false; // 消費
            if(typeof audio !== 'undefined') audio.playTone(400, 'sine', 0.05, 0.1);
        }

        const diff = this.targetAngle - this.angle;
        if (Math.abs(diff) > 0.01) {
            this.angle += diff * 12 * dt; // 旋回速度を少し抑えて酔い防止
        } else {
            this.angle = this.targetAngle;
            this.angle = MathUtils.normalizeAngle(this.angle);
            this.targetAngle = MathUtils.normalizeAngle(this.targetAngle);
        }
    }

_handleMovement(dt, inputMgr) {
        this.isMoving = false;
        this.makingNoise = false;
        let moveStep = 0;

        // ★スマホ用：ジョイスティックの入力(stickY)を移動量に変換
        // 遊び（0.05）を作って、指を離した時に勝手に動くのを防ぎます
        if (inputMgr.stickY && Math.abs(inputMgr.stickY) > 0.05) {
            moveStep = inputMgr.stickY * this.speed * dt;
            this.isMoving = true;
            this.makingNoise = true; 
        }

        if (moveStep !== 0) {
            const ts = GAME_CONFIG.TILE_SIZE;
            const radius = ts * 0.35; // 壁判定の厚み
            const moveAngle = this.targetAngle;

            const nx = this.x + Math.cos(moveAngle) * moveStep;
            const ny = this.y + Math.sin(moveAngle) * moveStep;

            // 移動方向（向き×進む方向）を考慮した符号計算
            // 前進でも後退でも、進行方向の壁を正しくチェックします
            const checkDirX = Math.sign(Math.cos(moveAngle) * moveStep);
            const checkDirY = Math.sign(Math.sin(moveAngle) * moveStep);

            if (!this.maze.isWall(Math.floor((nx + checkDirX * radius) / ts), Math.floor(this.y / ts))) {
                this.x = nx;
            }
            if (!this.maze.isWall(Math.floor(this.x / ts), Math.floor((ny + checkDirY * radius) / ts))) {
                this.y = ny;
            }

            // 通路センターへの吸い込み (Snapping)
            const centerX = Math.floor(this.x / ts) * ts + ts / 2;
            const centerY = Math.floor(this.y / ts) * ts + ts / 2;
            const snapSpeed = 0.15; 

            if (Math.abs(Math.cos(moveAngle)) > 0.7) { 
                // 左右移動中は、上下の位置を中央に寄せる
                this.y += (centerY - this.y) * snapSpeed;
            } else if (Math.abs(Math.sin(moveAngle)) > 0.7) {
                // 上下移動中は、左右の位置を中央に寄せる
                this.x += (centerX - this.x) * snapSpeed;
            }
        }
    }

    _applyHeadBob(dt) {
        if (this.isMoving) {
            this.headBobTimer += dt * 10;
            this.z = (GAME_CONFIG.TILE_SIZE / 2) + Math.sin(this.headBobTimer) * 4;
        } else {
            this.z += ((GAME_CONFIG.TILE_SIZE / 2) - this.z) * 10 * dt;
        }
    }

    _checkItemCollisions(particles) {
        const radius = GAME_CONFIG.TILE_SIZE * 0.4;
        
        for (let i = 0; i < this.maze.items.length; i++) {
            const item = this.maze.items[i];
            if (!item.active) continue;

            if (MathUtils.distance(this.x, this.y, item.x, item.y) < (radius + 10)) {
                item.active = false;
                
                if (item.type === 'DOT') {
                    this.score += 10;
                    this.dotsEaten++;
                    audio.playEatSound();
                } 
                else if (item.type === 'POWER') {
                    this.score += 50;
                    this.dotsEaten++;
                    audio.playTone(1000, 'sine', 0.5, 1.0); 
                    window.dispatchEvent(new CustomEvent('powerPelletEaten'));
                }
            }
        }
    }
}

// ----------------------------------------------------------------------------
// 13. STEALTH GHOST AI SYSTEM (視界、聴覚、巡回状態を持つ統合AI基盤)
// ----------------------------------------------------------------------------
class GhostBase {
    constructor(maze, player, id, type, color, startGridX, startGridY) {
        this.maze = maze;
        this.player = player;
        this.id = id;
        this.type = type;
        this.color = color;
        this.active = true;
        
        const ts = GAME_CONFIG.TILE_SIZE;
        this.startX = startGridX * ts + ts / 2;
        this.startY = startGridY * ts + ts / 2;
        this.x = this.startX;
        this.y = this.startY;
        this.z = ts / 2;
        
        this.gridX = startGridX;
        this.gridY = startGridY;
        
        // 固有のAIパラメータ（サブクラスで上書き可能）
        this.viewDistance = 10 * ts;    // 視認距離(ピクセル)
        this.fov = Math.PI / 2;         // 視野角 (90度)
        this.hearingRadius = 4 * ts;    // 足音が聞こえる範囲
        this.baseSpeed = GAME_CONFIG.GHOST_SPEED_NORMAL * 0.8; // 巡回は少し遅め
        this.chaseSpeed = GAME_CONFIG.GHOST_SPEED_CHASE * 1.1; // 追跡は早い
        
        this.facingAngle = 0; // ゴーストが向いている方向
        
        this.state = 'PATROL'; 
        this.speed = this.baseSpeed;
        
        this.path = [];
        this.currentPatrolIndex = 0;
        this.patrolNodes = []; // 巡回ルート(サブクラスで定義)
        
        this.investigateTarget = null;
        this.investigateTimer = 0;
        this.lostSightTimer = 0;
        this.pathUpdateTimer = 0;
    }

    update(dt) {
        if (!this.active) return;
        
        this.gridX = Math.floor(this.x / GAME_CONFIG.TILE_SIZE);
        this.gridY = Math.floor(this.y / GAME_CONFIG.TILE_SIZE);

        this._checkSenses();
        this._updateState(dt);
        this._moveAlongPath(dt);
    }

    // --- センサー（視覚と聴覚）の処理 ---
/** センサーと自主的な判断ロジック */
    _checkSenses() {
        if (this.state === 'EATEN' || this.state === 'SCARED') return;

        const canSee = this._checkLineOfSight();
        const canHear = this._checkHearing();

        if (canSee) {
            if (this.state !== 'CHASE') {
                audio.playTone(1500, 'square', 0.05, 0.5); // 発見時の鋭い音
            }
            this.state = 'CHASE';
            this.lostSightTimer = 0;
        } else if (this.state === 'CHASE') {
            this.lostSightTimer += 0.016;
            // 見失っても、プレイヤーの「予測移動先」に向かって数秒間突っ込む
            if (this.lostSightTimer > 4.0) { 
                this.state = 'INVESTIGATE';
                this.investigateTimer = 8.0; 
            }
        } else if (canHear) {
            // 音がした方へ自主的に調査しに行く
            this.state = 'INVESTIGATE';
            this.investigateTarget = new Vector2(
                Math.floor(this.player.x / GAME_CONFIG.TILE_SIZE),
                Math.floor(this.player.y / GAME_CONFIG.TILE_SIZE)
            );
        } else if (this.state === 'PATROL' && Math.random() < 0.005) {
            // ★自主性: 巡回中に「ふと気になって」近くの通路を調べに行く（気まぐれな動き）
            this.state = 'INVESTIGATE';
            this.investigateTimer = 3.0;
            this.investigateTarget = new Vector2(
                this.gridX + MathUtils.randomInt(-3, 3),
                this.gridY + MathUtils.randomInt(-3, 3)
            );
        }
    }

    // レイトキャストによる精密な視線判定
    _checkLineOfSight() {
        const dx = this.player.x - this.x;
        const dy = this.player.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > this.viewDistance) return false;

        let angleToPlayer = Math.atan2(dy, dx);
        let angleDiff = angleToPlayer - this.facingAngle;
        while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
        while (angleDiff >= Math.PI) angleDiff -= 2 * Math.PI;

        // 視野角の範囲内かチェック
        if (Math.abs(angleDiff) > this.fov / 2) return false;

        // DDA (Digital Differential Analyzer) による壁の遮蔽チェック
        const ts = GAME_CONFIG.TILE_SIZE;
        let x0 = this.x;
        let y0 = this.y;
        let x1 = this.player.x;
        let y1 = this.player.y;
        
        let rayDx = Math.abs(x1 - x0);
        let rayDy = Math.abs(y1 - y0);
        let sx = (x0 < x1) ? 1 : -1;
        let sy = (y0 < y1) ? 1 : -1;
        let err = rayDx - rayDy;

        let safety = 0;
        while (safety < 100) {
            safety++;
            let gx = Math.floor(x0 / ts);
            let gy = Math.floor(y0 / ts);
            
            if (gx === Math.floor(x1 / ts) && gy === Math.floor(y1 / ts)) {
                return true; 
            }
            if (this.maze.isWall(gx, gy)) {
                return false; 
            }
            let e2 = 2 * err;
            if (e2 > -rayDy) { err -= rayDy; x0 += sx * (ts/2); }
            if (e2 < rayDx) { err += rayDx; y0 += sy * (ts/2); }
        }
        return false;
    }

    _checkHearing() {
        if (!this.player.makingNoise) return false;
        const dist = MathUtils.distance(this.x, this.y, this.player.x, this.player.y);
        return dist <= this.hearingRadius;
    }

    // --- 状態マシンの更新 ---
    _updateState(dt) {
        this.pathUpdateTimer -= dt;

        switch (this.state) {
            case 'PATROL':
                this.speed = this.baseSpeed;
                this._handlePatrol();
                break;
            case 'CHASE':
                this.speed = this.chaseSpeed;
                this._handleChase();
                break;
            case 'INVESTIGATE':
                this.speed = this.baseSpeed;
                this._handleInvestigate(dt);
                break;
            case 'SCARED':
                this.speed = GAME_CONFIG.GHOST_SPEED_SCARED;
                this._handleScared();
                break;
            case 'EATEN':
                this.speed = this.chaseSpeed * 2.5; // 超高速で帰還
                this._handleEaten();
                break;
        }
    }

    _handlePatrol() {
        if (this.patrolNodes.length === 0) return;
        
        if (this.path.length === 0) {
            const target = this.patrolNodes[this.currentPatrolIndex];
            this.path = Pathfinder.getPath(this.maze, this.gridX, this.gridY, target.x, target.y);
            
            // パスがなければ次の巡回ポイントへ
            if (this.path.length === 0) {
                this.currentPatrolIndex = (this.currentPatrolIndex + 1) % this.patrolNodes.length;
            }
        }
        
        // 巡回ポイントに到達したら次のポイントを設定
        const targetNode = this.patrolNodes[this.currentPatrolIndex];
        if (this.gridX === targetNode.x && this.gridY === targetNode.y) {
            this.currentPatrolIndex = (this.currentPatrolIndex + 1) % this.patrolNodes.length;
            this.path = []; // パスをリセットして再計算させる
        }
    }

    _handleChase() {
        // プレイヤーの現在位置をターゲットに0.3秒ごとに経路更新
        if (this.pathUpdateTimer <= 0) {
            const px = Math.floor(this.player.x / GAME_CONFIG.TILE_SIZE);
            const py = Math.floor(this.player.y / GAME_CONFIG.TILE_SIZE);
            this.path = Pathfinder.getPath(this.maze, this.gridX, this.gridY, px, py);
            this.pathUpdateTimer = 0.3;
        }
    }

    _handleInvestigate(dt) {
        this.investigateTimer -= dt;
        if (this.investigateTimer <= 0) {
            // 警戒解除、巡回に戻る
            this.state = 'PATROL';
            this.path = [];
            return;
        }

        if (this.investigateTarget && this.path.length === 0) {
            this.path = Pathfinder.getPath(this.maze, this.gridX, this.gridY, this.investigateTarget.x, this.investigateTarget.y);
            if (this.path.length === 0) {
                 this.investigateTarget = null; // 到達または経路なし
            }
        }
        
        // ターゲット位置に到達したらランダムに周囲を見回すロジック
        if (!this.investigateTarget && this.path.length === 0) {
            this.facingAngle += Math.PI * dt; // その場でぐるぐる回って索敵
        }
    }

    _handleScared() {
        if (this.pathUpdateTimer <= 0 || this.path.length === 0) {
            // プレイヤーから最も遠い角をターゲットにする
            const corners = [

                {x: 1, y: 1}, {x: this.maze.width-2, y: 1},
                {x: 1, y: this.maze.height-2}, {x: this.maze.width-2, y: this.maze.height-2}
            ];
            
            let bestCorner = corners[0];
            let maxDist = -1;
            
            for(let corner of corners) {
                const cornerDist = MathUtils.distance(this.player.x, this.player.y, corner.x * GAME_CONFIG.TILE_SIZE, corner.y * GAME_CONFIG.TILE_SIZE);
                if(cornerDist > maxDist) {
                    maxDist = cornerDist;
                    bestCorner = corner;
                }
            }
            
            this.path = Pathfinder.getPath(this.maze, this.gridX, this.gridY, bestCorner.x, bestCorner.y);
            this.pathUpdateTimer = 1.0;
        }
    }

    _handleEaten() {
        // ハウスの中心点との距離を測る
        const distToHouse = MathUtils.distance(this.x, this.y, this.startX, this.startY);

        // ★修正: マス目判定ではなく「中心点から15ピクセル以内」に来たら到着とみなす
        if (distToHouse < 15) {
            this.x = this.startX;
            this.y = this.startY;
            this.path = []; 
            return;
        }

        // まだ遠い場合はハウス（中央）への道を計算して進む
        if (this.path.length === 0) {
            this.path = Pathfinder.getPath(this.maze, this.gridX, this.gridY, this.maze.ghostHouse.x, this.maze.ghostHouse.y);
        }
    }

    // --- 移動と物理処理 ---
    _moveAlongPath(dt) {
        if (this.path.length === 0) return;

        const ts = GAME_CONFIG.TILE_SIZE;
        const nextNode = this.path[0];
        const targetPixelX = nextNode.x * ts + ts / 2;
        const targetPixelY = nextNode.y * ts + ts / 2;

        const dx = targetPixelX - this.x;
        const dy = targetPixelY - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        if (dist > 0.1) {
            // 移動方向へ角度を滑らかに向ける
            const moveAngle = Math.atan2(dy, dx);
            
            let angleDiff = moveAngle - this.facingAngle;
            while (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
            while (angleDiff >= Math.PI) angleDiff -= 2 * Math.PI;
            
            this.facingAngle += angleDiff * 10 * dt;

            // 進行
            if (dist < this.speed * dt) {
                this.x = targetPixelX;
                this.y = targetPixelY;
                this.path.shift();
            } else {
                this.x += Math.cos(moveAngle) * this.speed * dt;
                this.y += Math.sin(moveAngle) * this.speed * dt;
            }
            
            // 浮遊アニメーション
            this.z = (ts / 2) + Math.sin(Date.now() / 150) * 8;
        } else {
            this.path.shift();
        }
    }

    setScared() {
        if (this.state === 'EATEN') return; 
        this.state = 'SCARED';
        this.path = []; 
        this.pathUpdateTimer = 0;
    }

    eat() {
        this.state = 'EATEN';
        this.path = [];
        this.pathUpdateTimer = 0;
        audio.playEatGhostSound();
    }
}

// ----------------------------------------------------------------------------
// 14. SPECIFIC STEALTH GHOSTS (個別の性格とパトロールルート設定)
// ----------------------------------------------------------------------------

/**
 * BLINKY (赤) - The Guard (外周警備)
 * 視界が非常に長く狭い。マップの外周を時計回りに巡回する兵士。
 */
class Blinky extends GhostBase {
    constructor(maze, player, startX, startY) {
        super(maze, player, 'GHOST_BLINKY', 'GHOST_BLINKY', GAME_CONFIG.GHOST_COLORS.BLINKY, startX, startY);
        
        const ts = GAME_CONFIG.TILE_SIZE;
        this.viewDistance = 15 * ts; // 超遠距離まで見える
        this.fov = Math.PI / 4;      // ただし視界は45度と狭い
        this.hearingRadius = 2 * ts; // 耳はあまり良くない

        // マップの外周四隅を巡回ルートに設定
        const w = maze.width;
        const h = maze.height;
        this.patrolNodes = [
            { x: 1, y: 1 },
            { x: w - 2, y: 1 },
            { x: w - 2, y: h - 2 },
            { x: 1, y: h - 2 }
        ];
    }
}

/**
 * PINKY (ピンク) - The Tracker (内周警戒・地獄耳)
 * 視界は普通だが、聴覚が異常に発達している。足音を立てると壁越しでも気づく。
 */
class Pinky extends GhostBase {
    constructor(maze, player, startX, startY) {
        super(maze, player, 'GHOST_PINKY', 'GHOST_PINKY', GAME_CONFIG.GHOST_COLORS.PINKY, startX, startY);
        
        const ts = GAME_CONFIG.TILE_SIZE;
        this.viewDistance = 8 * ts;  
        this.fov = Math.PI / 2;      
        this.hearingRadius = 8 * ts; // 半径8マス以内の足音を感知する（壁貫通）

        // マップの内側を逆時計回りに巡回
        const w = maze.width;
        const h = maze.height;
        const inset = 4;
        this.patrolNodes = [
            { x: inset, y: inset },
            { x: inset, y: h - inset - 1 },
            { x: w - inset - 1, y: h - inset - 1 },
            { x: w - inset - 1, y: inset }
        ];
    }
}

/**
 * INKY (水色) - The Watcher (左半分の監視)
 * 視界距離は短いが、視野角が180度以上あり、横を通り抜けようとするプレイヤーを見逃さない。
 */
class Inky extends GhostBase {
    constructor(maze, player, startX, startY) {
        super(maze, player, 'GHOST_INKY', 'GHOST_INKY', GAME_CONFIG.GHOST_COLORS.INKY, startX, startY);
        
        const ts = GAME_CONFIG.TILE_SIZE;
        this.viewDistance = 6 * ts;  // 短い
        this.fov = Math.PI * 1.2;    // 超広角(216度)
        this.hearingRadius = 3 * ts; 

        // 左半分の特定の部屋やエリアを8の字に巡回
        const w = maze.width;
        const h = maze.height;
        this.patrolNodes = [
            { x: 2, y: Math.floor(h/2) },
            { x: Math.floor(w/2)-2, y: 2 },
            { x: 2, y: 2 },
            { x: Math.floor(w/2)-2, y: Math.floor(h/2) }
        ];
    }
}

/**
 * CLYDE (オレンジ) - The Paranoid (右半分の警戒・不審者)
 * 挙動不審。巡回ポイントがランダムで、時折立ち止まっては突然振り返ったりする（Investigate状態を自発的に発動）。
 */
class Clyde extends GhostBase {
    constructor(maze, player, startX, startY) {
        super(maze, player, 'GHOST_CLYDE', 'GHOST_CLYDE', GAME_CONFIG.GHOST_COLORS.CLYDE, startX, startY);
        
        const ts = GAME_CONFIG.TILE_SIZE;
        this.viewDistance = 7 * ts;  
        this.fov = Math.PI / 2;      
        this.hearingRadius = 4 * ts; 
        
        this.paranoidTimer = 5.0; // 5秒ごとに不審な動きをする

        // 初期化時にマップ右半分のランダムな通路を巡回ノードとして抽出
        this.patrolNodes = [];
        const w = maze.width;
        const h = maze.height;
        for(let i=0; i<5; i++) {
            let rx, ry;
            let attempts = 0;
            do {
                rx = MathUtils.randomInt(Math.floor(w/2), w-2);
                ry = MathUtils.randomInt(1, h-2);
                attempts++;
            } while(maze.isWall(rx, ry) && attempts < 50);
            if(!maze.isWall(rx, ry)) {
                this.patrolNodes.push({x: rx, y: ry});
            }
        }
    }

    update(dt) {
        super.update(dt);
        
        // 巡回中に突然立ち止まって警戒モードに入る独自ロジック
        if (this.state === 'PATROL') {
            this.paranoidTimer -= dt;
            if (this.paranoidTimer <= 0) {
                this.state = 'INVESTIGATE';
                this.investigateTarget = null; // 特定のターゲットを持たずにキョロキョロする
                this.investigateTimer = 3.0;
                this.paranoidTimer = MathUtils.randomInt(5, 12); // 次の発動は5〜12秒後
            }
        }
    }
}

// ----------------------------------------------------------------------------
// ★追加: PARTICLE SYSTEM (欠落していたエフェクトエンジン)
// ----------------------------------------------------------------------------
class ParticleSystem {
    constructor() {
        this.particles = [];
    }

    spawn(x, y, z, color, count, speedBase) {
        for (let i = 0; i < count; i++) {
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos((Math.random() * 2) - 1);
            const speed = speedBase * (0.5 + Math.random() * 0.5);

            this.particles.push({
                x: x, y: y, z: z,
                vx: speed * Math.sin(phi) * Math.cos(theta),
                vy: speed * Math.sin(phi) * Math.sin(theta),
                vz: speed * Math.cos(phi),
                life: 1.0, decay: 0.02 + Math.random() * 0.03,
                color: color, size: 2 + Math.random() * 3
            });
        }
    }

    update(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.z += p.vz * dt;
            
            p.vz -= 980 * dt; 
            if (p.z < 0) {
                p.z = 0;
                p.vz *= -0.5; 
                p.vx *= 0.8;  
                p.vy *= 0.8;
            }

            p.life -= p.decay;
            if (p.life <= 0) {
                this.particles.splice(i, 1);
            }
        }
    }

    getEntities() {
        return this.particles.map(p => ({
            active: true, x: p.x, y: p.y, z: p.z,
            type: 'PARTICLE', color: p.color, life: p.life, size: p.size
        }));
    }
}

// ----------------------------------------------------------------------------
// 15. SAVE & DATA MANAGEMENT SYSTEM (ローカルストレージと永続データ管理)
// ----------------------------------------------------------------------------
class SaveSystem {
    constructor() {
        this.storageKey = 'pacmaze_v6_save_data';
        this.data = this.load();
    }
    load() {
        try {
            const raw = localStorage.getItem(this.storageKey);
            if (raw) {
                return JSON.parse(raw);
            }
        } catch (e) {
            console.warn("Save data corrupted or inaccessible.", e);
        }
        return this.getDefaultData();
    }
    save() {
        try {
            localStorage.setItem(this.storageKey, JSON.stringify(this.data));
        } catch (e) {
            console.warn("Failed to save game data.", e);
        }
    }
    getDefaultData() {
        return {
            highScore: 0,
            maxLevelReached: 1,
            totalDotsEaten: 0,
            ghostsEaten: 0,
            playCount: 0,
            achievements: []
        };
    }
    updateHighScore(score) {
        if (score > this.data.highScore) {
            this.data.highScore = score;
            this.save();
            return true;
        }
        return false;
    }
    addAchievement(id) {
        if (!this.data.achievements.includes(id)) {
            this.data.achievements.push(id);
            this.save();
        }
    }
    incrementStat(statName, value = 1) {
        if (typeof this.data[statName] === 'number') {
            this.data[statName] += value;
            this.save();
        }
    }
}

// ----------------------------------------------------------------------------
// 16. GAMEPAD MANAGER (コントローラー操作の統合)
// ----------------------------------------------------------------------------
class GamepadManager {
    constructor(inputMgr) {
        this.inputMgr = inputMgr;
        this.gamepadIndex = null;
        this.threshold = 0.5;
        this.mapping = {
            up: false, down: false, left: false, right: false, action: false
        };
        this.prevMapping = { ...this.mapping };

        window.addEventListener("gamepadconnected", (e) => {
            console.log("Gamepad connected:", e.gamepad.id);
            this.gamepadIndex = e.gamepad.index;
        });
        window.addEventListener("gamepaddisconnected", (e) => {
            if (this.gamepadIndex === e.gamepad.index) {
                this.gamepadIndex = null;
            }
        });
    }

    update() {
        this.prevMapping = { ...this.mapping };
        
        if (this.gamepadIndex === null) return;
        const gamepads = navigator.getGamepads();
        const gp = gamepads[this.gamepadIndex];
        if (!gp) return;

        // 左スティックと十字キーの統合処理
        const axisX = gp.axes[0];
        const axisY = gp.axes[1];
        
        this.mapping.up = gp.buttons[12]?.pressed || axisY < -this.threshold;
        this.mapping.down = gp.buttons[13]?.pressed || axisY > this.threshold;
        this.mapping.left = gp.buttons[14]?.pressed || axisX < -this.threshold;
        this.mapping.right = gp.buttons[15]?.pressed || axisX > this.threshold;
        
        // Aボタン / クロスボタン
        this.mapping.action = gp.buttons[0]?.pressed;

        // InputMgrに状態を注入 (キーボードと同等に扱う)
        if (this.mapping.up) this.inputMgr.keys['ArrowUp'] = true;
        else if (this.prevMapping.up) this.inputMgr.keys['ArrowUp'] = false;

        if (this.mapping.down) this.inputMgr.keys['ArrowDown'] = true;
        else if (this.prevMapping.down) this.inputMgr.keys['ArrowDown'] = false;

        if (this.mapping.left && !this.prevMapping.left) {
            this.inputMgr.keys['ArrowLeft'] = true; // JustPressed判定のため
            setTimeout(() => this.inputMgr.keys['ArrowLeft'] = false, 50);
        }
        if (this.mapping.right && !this.prevMapping.right) {
            this.inputMgr.keys['ArrowRight'] = true;
            setTimeout(() => this.inputMgr.keys['ArrowRight'] = false, 50);
        }
    }
}

// ----------------------------------------------------------------------------
// 17. COMBO & SCORING SYSTEM (連鎖スコア計算)
// ----------------------------------------------------------------------------
class ComboSystem {
    constructor() {
        this.baseGhostScore = 200;
        this.multiplier = 1;
        this.active = false;
        this.comboCount = 0;
    }
    startPowerMode() {
        this.active = true;
        this.multiplier = 1;
        this.comboCount = 0;
    }
    endPowerMode() {
        this.active = false;
        this.multiplier = 1;
        this.comboCount = 0;
    }
    eatGhost() {
        if (!this.active) return 0;
        const points = this.baseGhostScore * this.multiplier;
        this.multiplier *= 2; // 200 -> 400 -> 800 -> 1600
        this.comboCount++;
        return points;
    }
}

// ----------------------------------------------------------------------------
// 18. DYNAMIC DIFFICULTY DIRECTOR (動的難易度調整・AI監督)
// ----------------------------------------------------------------------------
class DifficultyDirector {
    constructor() {
        this.baseDifficulty = 1.0;
        this.currentDifficulty = 1.0;
        this.playerStealthTime = 0;
        this.playerChaseTime = 0;
    }
    
    resetForLevel(level) {
        // レベルが上がるごとにベース難易度が上昇
        this.baseDifficulty = 1.0 + (level * 0.1);
        this.currentDifficulty = this.baseDifficulty;
        this.playerStealthTime = 0;
        this.playerChaseTime = 0;
    }

    update(dt, isChased) {
        if (isChased) {
            this.playerChaseTime += dt;
            this.playerStealthTime = 0;
            // 長時間追われていると、少しだけゴーストが手加減する（速度減衰）
            if (this.playerChaseTime > 10) {
                this.currentDifficulty = Math.max(this.baseDifficulty * 0.8, this.currentDifficulty - dt * 0.05);
            }
        } else {
            this.playerStealthTime += dt;
            this.playerChaseTime = 0;
            // 長時間見つかっていないと、ゴーストの感覚が鋭くなる
            if (this.playerStealthTime > 20) {
                this.currentDifficulty = Math.min(this.baseDifficulty * 1.5, this.currentDifficulty + dt * 0.02);
            }
        }
    }

    // AIに適用する係数を返す
    getSpeedMultiplier() {
        return Math.min(2.0, this.currentDifficulty);
    }
    getVisionMultiplier() {
        return Math.min(1.5, this.currentDifficulty);
    }
}

// ----------------------------------------------------------------------------
// 19. MAIN GAME ENGINE (全体統括・ステートマシン)
// ----------------------------------------------------------------------------
class GameEngine {
    constructor() {
        // システムモジュールの初期化
        this.saveSystem = new SaveSystem();
        this.gamepad = new GamepadManager(input); // inputはPart1のグローバル変数
        this.combo = new ComboSystem();
        this.director = new DifficultyDirector();
        this.textureGen = new TextureGenerator();
        this.textureGen.generateAll();

        // 状態管理
        this.gameState = 'MENU'; // MENU, PLAYING, DYING, CLEAR, GAMEOVER
        this.level = 1;
        this.lastTime = performance.now();
        this.powerModeTimer = 0;
        
        // 描画・UI系
        this.uiManager = new FloatingUIManager();
        this.particles = new ParticleSystem();
        
        // DOMキャッシュ
        this.ui = {
            score: document.getElementById('ui-score'),
            level: document.getElementById('ui-level'),
            dots: document.getElementById('ui-dots'),
            hiscore: document.getElementById('ui-hiscore'),
            lives: document.getElementById('ui-lives'),
            startScreen: document.getElementById('start-screen'),
            btnStart: document.getElementById('btn-start'),
            msgMain: document.getElementById('msg-main'),
            msgSub: document.getElementById('msg-sub'),
            damageFlash: document.getElementById('damage-flash')
        };

        // イベントバインディング
        ['click', 'touchstart'].forEach(type => {
            this.ui.btnStart.addEventListener(type, (e) => {
                e.preventDefault();
                this.bootSequence();
            }, { passive: false });
        });
        window.addEventListener('powerPelletEaten', () => this.triggerPowerMode());

        // 初期UIセット
        this.ui.hiscore.innerText = this.saveSystem.data.highScore.toString().padStart(6, '0');
        
        // メインループ起動
        requestAnimationFrame((t) => this.loop(t));
    }

/** 「INITIALIZE SYSTEM」ボタン押下時の演出と起動処理 */
    bootSequence() {
        const validStates = ['MENU', 'GAMEOVER', 'RESTART_WAIT'];
        if (!validStates.includes(this.gameState)) return;
        
        const isRestart = (this.gameState === 'RESTART_WAIT');
        audio.resume();
        audio.playStartSound();
        this.ui.btnStart.style.display = 'none';
        
        let glitchCount = 0;
        const glitchInterval = setInterval(() => {
            glitchCount++;
            this.ui.startScreen.style.opacity = glitchCount % 2 === 0 ? '0.2' : '1';
            if (glitchCount > 4) {
                clearInterval(glitchInterval);
                this.ui.startScreen.style.display = 'none'; 
                this.ui.startScreen.classList.add('hidden');
                if (isRestart) this.respawn(); else this.startNewGame();
            }
        }, 100);
    }

    
    /** ゲーム全体の初期化 (スコアや残機のリセット) */
    startNewGame() {
        this.saveSystem.incrementStat('playCount');
        this.level = 1;
        this.playerData = {
            score: 0,
            lives: 3
        };
        this.initLevel();
    }

    /** レベル(迷路)ごとの初期化と構築 */
    initLevel() {
        this.gameState = 'INIT';
        this.director.resetForLevel(this.level);
        
        // 迷路の生成 (レベルが上がるごとに少しずつ広く、複雑になる)
        const baseSize = 15;
        const sizeIncrease = Math.min(10, Math.floor(this.level / 2) * 2);
        this.maze = new MazeEngine(baseSize + sizeIncrease, baseSize + sizeIncrease);
        this.maze.buildLevel();

        // プレイヤーの配置
        this.player = new Player(this.maze);
        this.player.score = this.playerData.score;
        this.player.lives = this.playerData.lives;

        // ゴーストの配置
        const cx = this.maze.ghostHouse.x;
        const cy = this.maze.ghostHouse.y;
        this.ghosts = [
            new Blinky(this.maze, this.player, cx, cy),
            new Pinky(this.maze, this.player, cx - 1, cy),
            new Inky(this.maze, this.player, cx + 1, cy),
            new Clyde(this.maze, this.player, cx, cy + 1)
        ];

        // ゴーストのベースパラメータにディレクターの補正を適用
        const speedMult = this.director.getSpeedMultiplier();
        const viewMult = this.director.getVisionMultiplier();
       
        // レンダラーの再構築
        this.renderer = new Renderer(this.maze, this.textureGen);
        
        // UIのリセット
        this.updateHUD();
        this.particles.particles = [];
        this.powerModeTimer = 0;
        this.combo.endPowerMode();

        // 画面演出
        this.showCenterMessage(`LEVEL ${this.level}`, 'COMMENCING MISSION...', 2000);
        
        setTimeout(() => {
            this.gameState = 'PLAYING';
            this.lastTime = performance.now();
        }, 2000);
    }

    /** クッキー(パワーエサ)取得時の処理 */
    triggerPowerMode() {
        this.powerModeTimer = GAME_CONFIG.GHOST_SCARED_TIME / 1000; // 秒に変換
        this.combo.startPowerMode();
        
        // UI演出
        this.ui.score.style.color = GAME_CONFIG.COLORS.POWER_PELLET;
        this.ui.score.style.textShadow = `0 0 15px ${GAME_CONFIG.COLORS.POWER_PELLET}`;
        
        this.ghosts.forEach(g => g.setScared());
        
        // 実績チェック
        achievements.unlock('power_up', 'SYSTEM OVERRIDE: Power Mode Engaged', '🔋');
    }

    /** メインループ (毎フレーム実行) */


    loop(time) {
        requestAnimationFrame((t) => this.loop(t));

        // デルタタイム計算 (最大0.1秒にキャップしてフレーム落ち時の壁抜けを防止)
        const dt = Math.min((time - this.lastTime) / 1000, 0.1);
        this.lastTime = time;

        this.gamepad.update();

        // 状態ごとの処理分岐
        if (this.gameState === 'PLAYING') {
            this.updatePlaying(dt);
        } else if (this.gameState === 'DYING') {
            this.updateDying(dt);
        }

        // 常に描画は行う
        if (this.maze && this.renderer) {
            this.draw();
        }

        // キー入力状態の更新
        input.update();
    }

    /** プレイ中のロジック更新 */
    updatePlaying(dt) {
        // AI監督の更新（誰かに追われているか？）
        const isChased = this.ghosts.some(g => g.state === 'CHASE');
        this.director.update(dt, isChased);

// パワーモードのタイマー処理
        if (this.powerModeTimer > 0) {
            this.powerModeTimer -= dt;
            if (this.powerModeTimer <= 0) {
                // 効果終了時のリセット
                this.combo.endPowerMode();
                this.ui.score.style.color = '#ff0'; 
                this.ui.score.style.textShadow = '0 0 10px #ff0';
                this.ui.score.style.opacity = '1';
                
                // ★修正: 逃走中(SCARED)とハウス待機中(EATEN)を同時に通常状態に戻す
                this.ghosts.forEach(g => {
                    if (g.state === 'SCARED' || g.state === 'EATEN') {
                        if (g.state === 'EATEN') {
                            g.x = g.startX;
                            g.y = g.startY;
                        }
                        g.state = 'PATROL';
                        g.path = []; 
                    }
                });
            } else if (this.powerModeTimer < 2.0) {
                // 終了前の点滅
                this.ui.score.style.opacity = Math.floor(this.powerModeTimer * 10) % 2 === 0 ? '0.5' : '1';
            }
        }

        // エンティティの更新
        this.player.update(dt, input, this.particles);
        this.ghosts.forEach(g => g.update(dt));
        this.particles.update(dt);

        // 衝突判定とクリア判定
        this.checkCollisions();
        this.checkWinCondition();
        
        // データの永続化
        this.playerData.score = this.player.score;
        this.updateHUD();
        this.checkAchievements();
    }

    /** 当たり判定 (プレイヤー vs ゴースト) */
    checkCollisions() {
        const hitRadius = GAME_CONFIG.TILE_SIZE * 0.5;
        
        for (let i = 0; i < this.ghosts.length; i++) {
            const ghost = this.ghosts[i];
            if (!ghost.active || ghost.state === 'EATEN') continue;

            const dist = MathUtils.distance(this.player.x, this.player.y, ghost.x, ghost.y);
            
            if (dist < hitRadius) {
                if (ghost.state === 'SCARED') {
                    // ゴーストを食べる
                    ghost.eat();
                    const points = this.combo.eatGhost();
                    this.player.score += points;
                    this.saveSystem.incrementStat('ghostsEaten');
                    
                    // スコアのパーティクルを発生(黄色)
                    this.particles.spawn(ghost.x, ghost.y, ghost.z, '#ffff00', 15, 150);
                    
                    // 画面に獲得ポイントを一瞬表示
                    this.showCenterMessage(`${points} PTS!`, 'GHOST NEUTRALIZED', 1000);
                    
                } else if (ghost.state !== 'EATEN') {
                    // プレイヤーがやられる
                    this.handlePlayerDeath();
                    return; // 複数同時に当たっても1回だけ処理
                }
            }
        }
    }

    /** プレイヤー死亡時のシーケンス */
    handlePlayerDeath() {
        this.gameState = 'DYING';
        this.player.lives--;
        this.playerData.lives = this.player.lives;
        
        if (typeof audio !== 'undefined') audio.playTone(200, 'sawtooth', 1.0, 1.0);
        
        // 画面フラッシュ演出
        const flash = document.getElementById('damage-flash');
        if (flash) {
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 150);
        }

        this.showCenterMessage('SYSTEM ERROR', 'REBOOTING...', 3000);

        setTimeout(() => {
            if (this.player.lives > 0) {
                // 自動で復活させず、ボタン画面を表示して待機する
                this.gameState = 'RESTART_WAIT';
                this.ui.startScreen.style.display = 'flex';
                this.ui.startScreen.style.opacity = '1';
                this.ui.startScreen.style.background = 'rgba(0, 20, 30, 0.8)';
                this.ui.startScreen.classList.remove('hidden');
                
                document.getElementById('screen-title').innerText = 'SYSTEM RECOVERY';
                document.getElementById('screen-title').style.color = '#0ff';
                
                this.ui.btnStart.innerText = 'RESTART SYSTEM';
                this.ui.btnStart.style.display = 'block';
            } else {
                this.handleGameOver();
            }
        }, 3000);
    }

    updateDying(dt) {
        // 死亡演出中はパーティクルだけ更新
        this.particles.update(dt);
        // カメラがゆっくり下を向くようなエフェクト
        this.player.z -= 50 * dt;
        if(this.player.z < 5) this.player.z = 5;
    }

    /** リスポーン (残機がある場合) */
    respawn() {
        // プレイヤーとゴーストの位置を初期化
        const ts = GAME_CONFIG.TILE_SIZE;
        this.player.x = this.maze.spawnPoint.x * ts + ts / 2;
        this.player.y = this.maze.spawnPoint.y * ts + ts / 2;
        this.player.z = ts / 2;
        this.player.angle = 0;
        this.player.targetAngle = 0;
        
        this.ghosts.forEach(g => {
            g.x = g.startX;
            g.y = g.startY;
            g.state = 'PATROL';
            g.path = [];
        });
        
        this.powerModeTimer = 0;
        this.updateHUD();
        this.gameState = 'PLAYING';
    }

    /** ゲームオーバー処理 */
    handleGameOver() {
        this.gameState = 'GAMEOVER';
        const isNewRecord = this.saveSystem.updateHighScore(this.player.score);
        
        // 【修正】displayを 'flex' に戻して、画面が見えるようにする
        this.ui.startScreen.style.display = 'flex';
        this.ui.startScreen.classList.remove('hidden');
        this.ui.startScreen.style.background = 'rgba(20, 0, 0, 0.9)'; 
        this.ui.startScreen.style.opacity = '1';
        
        const mainTitle = document.getElementById('screen-title');
        if (mainTitle) {
            mainTitle.innerText = 'GAME OVER';
            mainTitle.style.color = '#f00';
            mainTitle.style.textShadow = '0 0 20px #f00';
        }
        
        const subDesc = document.getElementById('screen-desc');
        if (subDesc) {
            subDesc.innerHTML = `
                FINAL SCORE: <span style="color:#ff0; font-size:24px;">${this.player.score}</span><br>
                LEVEL REACHED: ${this.level}<br><br>
                ${isNewRecord ? '<span style="color:#0f0; font-weight:bold; font-size:20px;">NEW RECORD ESTABLISHED!</span>' : ''}
            `;
        }
        
        this.ui.btnStart.innerText = 'RESTART SYSTEM';
        this.ui.btnStart.style.display = 'block';
        
        achievements.unlock('game_over', 'Mission Failed', '💀');
    }

    /** レベルクリア（すべてのドットを食べたか）判定 */
    checkWinCondition() {
        if (this.player.dotsEaten >= this.maze.totalDots) {
            this.gameState = 'CLEAR';
            this.saveSystem.incrementStat('totalDotsEaten', this.player.dotsEaten);
            
            // ボーナススコア
            const timeBonus = Math.max(0, 1000 - Math.floor(this.director.playerStealthTime + this.director.playerChaseTime) * 10);
            this.player.score += timeBonus;
            
            audio.playTone(1000, 'sine', 0.2);
            setTimeout(() => audio.playTone(1500, 'sine', 0.4), 200);
            
            this.showCenterMessage('SECTOR CLEARED', `TIME BONUS: +${timeBonus}`, 3000);
            
            setTimeout(() => {
                this.level++;
                if (this.level > this.saveSystem.data.maxLevelReached) {
                    this.saveSystem.data.maxLevelReached = this.level;
                    this.saveSystem.save();
                }
                this.initLevel();
            }, 3000);
        }
    }

    /** 毎フレームの描画統合 */
    draw() {
        // レンダラーに渡すエンティティリストの生成
        const entities = [
            ...this.maze.items,
            ...this.ghosts,
            ...this.particles.getEntities()
        ];
        
        // 3Dレンダリング
        this.renderer.render(this.player, entities);
        
        // ★追加: フローティングUI(！マークや？マーク)の更新
        const projDist = (this.renderer.mainCanvas.width / 2) / Math.tan(GAME_CONFIG.FOV / 2);
        this.uiManager.update(
            this.player, 
            this.ghosts, 
            this.renderer.mainCanvas.width, 
            this.renderer.mainCanvas.height, 
            projDist
        );
    }

    /** HTML上のUI(HUD)のテキストやアイコンの更新 */
    updateHUD() {
        this.ui.score.innerText = this.player.score.toString().padStart(6, '0');
        this.ui.level.innerText = this.level;
        
        const dotsLeft = this.maze.totalDots - this.player.dotsEaten;
        this.ui.dots.innerText = dotsLeft.toString().padStart(3, '0');
        
        // ハイスコアのリアルタイム更新
        if (this.player.score > this.saveSystem.data.highScore) {
            this.ui.hiscore.innerText = this.player.score.toString().padStart(6, '0');
            this.ui.hiscore.style.color = '#0f0';
        }

        // 残機アイコンの描画更新
        this.ui.lives.innerHTML = '';
        for (let i = 0; i < this.player.lives; i++) {
            const lifeIcon = document.createElement('div');
            lifeIcon.className = 'life-icon';
            this.ui.lives.appendChild(lifeIcon);
        }
    }

    /** 画面中央にテキストをアニメーション表示するユーティリティ */
    showCenterMessage(mainStr, subStr, duration) {
        this.ui.msgMain.innerText = mainStr;
        this.ui.msgSub.innerText = subStr;
        
        this.ui.msgMain.style.opacity = '1';
        this.ui.msgSub.style.opacity = '1';
        
        // CSSトランジションをリセットして発動させるための小技
        this.ui.msgMain.style.transform = 'scale(0.5)';
        requestAnimationFrame(() => {
            this.ui.msgMain.style.transition = 'all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            this.ui.msgMain.style.transform = 'scale(1.0)';
        });

        if (this.msgTimeout) clearTimeout(this.msgTimeout);
        this.msgTimeout = setTimeout(() => {
            this.ui.msgMain.style.opacity = '0';
            this.ui.msgSub.style.opacity = '0';
        }, duration);
 }

    /** プレイ中の行動に基づく実績(アチーブメント)の解除チェック */
    checkAchievements() {
        if (this.player.score >= 10000) achievements.unlock('score_10k', 'Score 10,000 Points', '🏅');
        if (this.level >= 5) achievements.unlock('level_5', 'Reach Sector 5', '🗺️');
        if (this.combo.comboCount >= 4) achievements.unlock('combo_4', 'Eat 4 Ghosts in one go!', '👻');
        if (this.director.playerStealthTime > 60) achievements.unlock('ninja', 'Unseen for 60 seconds', '🥷');
    }
}

    const gameEngine = new GameEngine();
    console.log("3D PAC-MAZE V6 ULTIMATE ENGINE INITIALIZED.");
    console.log("Awaiting user input to commence boot sequence...");
});
