<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        /* ==========================================================================
           CSS RESET & BASE STYLES
           ========================================================================== */
        /* ★重要：@importは必ず一番上に書く */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            color: #0ff;
            background-color: #050505;
            color: #0ff;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        /* ==========================================================================
           CANVAS LAYERS
           ========================================================================== */
       #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column; /* 縦に並べる */
    background: #000;
    /* スマホで画面が跳ねたりリロードされたりするのを防ぐ */
    overscroll-behavior-y: contain;
    touch-action: none;
}

/* 上半分：3Dカメラエリア */
#view-area {
    position: relative;
    flex: 1; /* 残りのスペースをすべて使う */
    width: 100%;
    overflow: hidden;
    border-bottom: 2px solid #0ff;
}

/* 下半分：コントロールエリア */
#control-area {
    position: relative;
    height: 40%; /* 下半分の高さを40%に指定 */
    width: 100%;
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* メインキャンバス（view-areaいっぱいに表示） */
#main-canvas {
    width: 100%;
    height: 100%;
    display: block;
}

/* レーダー：コントロールエリアの背景として大きく表示 */
/* レーダー：上部に移動し、範囲を限定 */
        /* レーダー：下のエリアの「中央」に配置 */
        #radar-container {
            position: absolute;
            top: 35%; /* 下エリアの中央付近 */
            left: 47%;
            transform: translate(-50%, -50%);
            width: 110px; /* ボタンと被らないよう少しコンパクトに */
            height: 110px;
            opacity: 1.0;
            z-index: 10;
            border: 2px solid #0ff;
            background: rgba(0, 10, 20, 0.9);
            border-radius: 4px;             overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }
        #radar-canvas { width: 100%; height: 100%; }

        /* ジョイスティック：左端に配置 */
        #joystick-container {
            position: absolute;
            bottom: 70px;
            left: 25px;
            width: 60px;
            height: 150px;
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 30px;
            z-index: 100;
        }
        #joystick-stick {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: #0ff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #0ff;
        }

        /* 回転ボタン：右側に寄せて配置 */
        .turn-btn {
            position: absolute;
            bottom: 60px; /* マップの下端に合わせる */
            width: 70px;
            height: 70px;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #0ff;
            color: #0ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            z-index: 100;
            pointer-events: auto;
        }
        #btn-turn-l { right: 105px; } /* 左回転ボタン */
        #btn-turn-r { right: 25px; }  /* 右回転ボタン */
        /* HUD：残機を左、スコアを右に */
        #status-container {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 20px;
            z-index: 50;
        }
        .lives-container { display: flex; gap: 8px; }
        .life-icon { width: 20px; height: 20px; background: #ff0; border-radius: 50%; clip-path: polygon(100% 74%, 44% 48%, 100% 21%, 100% 0, 0 0, 0 100%, 100% 100%); }

        /* タイトル画面 */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 3000; transition: opacity 0.5s;
        }
        .title-glow { font-size: clamp(32px, 10vw, 54px); color: #fff; text-shadow: 0 0 20px #0ff; margin-bottom: 20px; }
        .btn-start { padding: 15px 40px; font-family: inherit; background: #0ff; color: #000; border: none; font-size: 20px; cursor: pointer; box-shadow: 0 0 15px #0ff; }
        .hidden { display: none !important; }
/* --- 追加：画面中央のメッセージ表示設定 --- */
        #center-text-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 1000;
        }
        .main-message {
            font-size: clamp(40px, 12vw, 80px);
            color: #fff;
            text-shadow: 0 0 20px #0ff;
            font-weight: bold;
            opacity: 0;
            transition: all 0.3s;
        }
        .sub-message {
            font-size: clamp(16px, 4vw, 24px);
            color: #0ff;
            letter-spacing: 4px;
            opacity: 0;
            margin-top: 10px;
        }

        /* --- 追加：ダメージ演出用のフラッシュ --- */
        .warning-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            z-index: 500;
            transition: opacity 0.1s;
        }
</style>

<script>
/**
 * ============================================================================
 * 3D PAC-MAZE V6 ULTIMATE - PART 1: Core Engine & Systems
 * ============================================================================
 */

// ----------------------------------------------------------------------------
// 1. CONFIGURATION (ゲーム全体の設定定数)
// ----------------------------------------------------------------------------
const GAME_CONFIG = {
    TILE_SIZE: 64,          // 1マスのサイズ（酔い防止のため広め）
    FOV: Math.PI / 2.5,     // 視野角 (約72度)
    RENDER_RAY_COUNT: 240,  // レンダリング解像度（負荷と画質のバランス）
    MAX_DEPTH: 14,          // 描画距離（これ以上遠くは暗闇）
    
    // プレイヤー設定
    PLAYER_SPEED: 180,      // 移動速度 (ピクセル/秒)
    TURN_SPEED: Math.PI * 2,// 旋回速度 (90度スナップ時のアニメーション用)
    
    // ゴースト設定
    GHOST_SPEED_NORMAL: 80,  // ゴーストの基本速度 (プレイヤーより少し遅い)
    GHOST_SPEED_CHASE: 100,   // 発見時の追跡速度
    GHOST_SPEED_SCARED: 80,   // イジケ状態の速度
    GHOST_SCARED_TIME: 8000,  // イジケ状態の持続時間(ms)
    
    // 色設定 (ネオンカラー)
    COLORS: {
        CEILING: '#020202',
        FLOOR: '#0a0a0a',
        WALL_BASE: '#002233',
        WALL_LINE: '#00ffff',
        DOT: '#ffff00',
        POWER_PELLET: '#00ffaa',
        ITEM_BOOTS: '#0088ff',
        ITEM_CLOCK: '#ffffff'
    },
    
    // ゴースト個別の色
    GHOST_COLORS: {
        BLINKY: '#ff0000', // 赤: 追跡
        PINKY:  '#ffb8ff', // ピンク: 先回り
        INKY:   '#00ffff', // 水色: 挟み撃ち
        CLYDE:  '#ffb852'  // オレンジ: 気まぐれ
    }
};

// ----------------------------------------------------------------------------
// 2. MATH UTILITIES (算術・便利関数群 - MathUtilsとして統合)
// ----------------------------------------------------------------------------
class MathUtils {
    /** 度数法から弧度法(ラジアン)への変換 */
    static degToRad(degrees) {
        return degrees * (Math.PI / 180);
    }

    /** 弧度法から度数法への変換 */
    static radToDeg(radians) {
        return radians * (180 / Math.PI);
    }

    /** 2点間のユークリッド距離を計算 */
    static distance(x1, y1, x2, y2) {
        return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
    }

    /** 角度を 0 ～ 2π の範囲に正規化する */
    static normalizeAngle(angle) {
        angle = angle % (2 * Math.PI);
        if (angle < 0) {
            angle = (2 * Math.PI) + angle;
        }
        return angle;
    }

    /** 線形補間 (Lerp) - アニメーションや滑らかなカメラ移動に利用 */
    static lerp(start, end, amount) {
        return start + (end - start) * amount;
    }

    /** 指定範囲のランダムな整数を生成 */
    static randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    /** 配列からランダムな要素を取得 */
    static randomChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }
    
    /** 2つの矩形(円形近似)の衝突判定 */
    static checkCollision(x1, y1, r1, x2, y2, r2) {
        return this.distance(x1, y1, x2, y2) < (r1 + r2);
    }
}

// ----------------------------------------------------------------------------
// 3. INPUT MANAGER (キーボード操作と90度スナップ制御)
// ----------------------------------------------------------------------------


class InputMgr {
    constructor() {
        this.keys = {}; 
        this.stickY = 0; 
        this.turnLeftTrigger = false;
        this.turnRightTrigger = false;
        
        this.touchIdStick = null;
        this.stickStartPos = { y: 0 };

        // タッチイベントの登録
        window.addEventListener('touchstart', (e) => this._handleTouch(e), { passive: false });
        window.addEventListener('touchmove', (e) => this._handleTouch(e), { passive: false });
        window.addEventListener('touchend', (e) => this._handleTouch(e), { passive: false });
    }

    _handleTouch(e) {
        if (e.cancelable) e.preventDefault();
        const stickMax = 70; // 縦方向の最大移動量

        // 指を離した時の処理
        if (e.type === 'touchend' || e.type === 'touchcancel') {
            for (let t of e.changedTouches) {
                if (t.identifier === this.touchIdStick) {
                    this.touchIdStick = null;
                    this.stickY = 0;
                    document.getElementById('joystick-stick').style.transform = 'translate(-50%, -50%)';
                }
            }
            return;
        }

        const stickRect = document.getElementById('joystick-container').getBoundingClientRect();
        
        for (let t of e.touches) {
            // 回転ボタンのタップ判定
            if (e.type === 'touchstart') {
                const el = document.elementFromPoint(t.clientX, t.clientY);
                if (el) {
                    if (el.id === 'btn-turn-l') { this.turnLeftTrigger = true; continue; }
                    if (el.id === 'btn-turn-r') { this.turnRightTrigger = true; continue; }
                }
            }

            // ジョイスティックの移動判定（縦のみ）
            const isInsideStickArea = (t.clientX >= stickRect.left && t.clientX <= stickRect.right && t.clientY >= stickRect.top && t.clientY <= stickRect.bottom);
            
            if (this.touchIdStick === null && isInsideStickArea && e.type === 'touchstart') {
                this.touchIdStick = t.identifier;
                this.stickStartPos.y = t.clientY;
            } else if (t.identifier === this.touchIdStick) {
                const dy = t.clientY - this.stickStartPos.y;
                const dist = Math.max(-stickMax, Math.min(stickMax, dy));
                
                // ★速度の微調整: 0.65を掛けてプレイヤーが速すぎないように制限
                this.stickY = -(dist / stickMax) * 0.65;
                
                // 見た目のスティックを縦にだけ動かす
                document.getElementById('joystick-stick').style.transform = `translate(-50%, calc(-50% + ${dist}px))`;
            }
        }
    }

    update() {}
    isDown(code) { return !!this.keys[code]; }
    isJustPressed(code) { return !!this.keys[code]; }
}
// ----------------------------------------------------------------------------
// 4. AUDIO ENGINE (Web Audio API & MML Parser)
// ----------------------------------------------------------------------------
class AudioEngine {
    constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = 0.3; // 全体の音量調整
        this.masterGain.connect(this.ctx.destination);
        
        this.isMuted = false;
        
        // BGM用の発音ノード管理
        this.bgmOscillators = [];
        this.isPlayingBgm = false;
    }

    /** ユーザーアクション(STARTクリック時)にAudioContextを再開する(ブラウザ制限対策) */
    resume() {
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    /** 単音を鳴らす基本機能 */
    playTone(freq, type = 'square', duration = 0.1, vol = 1.0) {
        if (this.isMuted) return;
        
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        
        // エンベロープ (音の立ち上がりと減衰)
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(this.masterGain);
        
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    }

    /** 効果音: ドットを食べる音 (ワカワカ) */
    playEatSound() {
        // 短い矩形波のピッチダウンで表現
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.1);
        
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.1);
        
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    }

    /** 効果音: ゴーストを食べる音 */
playEatGhostSound() {
        this.playTone(800, 'square', 0.2, 0.5);
        setTimeout(() => this.playTone(1200, 'square', 0.2, 0.5), 50);
    }
    /** 効果音: スタート時のシステム起動音 */
    playStartSound() {
        this.playTone(440, 'square', 0.1);
        setTimeout(() => this.playTone(880, 'square', 0.2), 150);
        setTimeout(() => this.playTone(1760, 'square', 0.4), 300);
    }
    
    /** 効果音: アチーブメント解除音 */
    playAchievementSound() {
        this.playTone(1200, 'sine', 0.1, 0.5);
        setTimeout(() => this.playTone(1600, 'sine', 0.3, 0.5), 100);
    }
}

// ----------------------------------------------------------------------------
// 5. ACHIEVEMENT MANAGER (実績・通知システム)
// ----------------------------------------------------------------------------
class AchievementMgr {
    constructor(audioEngine) {
        this.container = document.getElementById('achievement-container');
        this.unlocked = new Set(); // 既に解除した実績IDを保持
        this.audio = audioEngine;
    }

    /**
     * 実績を解除し、画面に通知を表示する
     * @param {string} id - 実績の一意のID
     * @param {string} title - 表示されるテキスト
     * @param {string} icon - 表示されるアイコン(絵文字など)
     */
    unlock(id, title, icon = '🏆') {
        // 既に解除済みなら何もしない
        if (this.unlocked.has(id)) return;
        
        this.unlocked.add(id);
        this.audio.playAchievementSound();
        
        // DOM要素の生成
        const toast = document.createElement('div');
        toast.className = 'achievement-toast';
        toast.innerHTML = `
            <div class="achievement-icon">${icon}</div>
            <div>
                <div style="font-size: 10px; color: #aaa;">ACHIEVEMENT UNLOCKED</div>
                <div style="font-weight: bold; letter-spacing: 1px;">${title}</div>
            </div>
        `;
        
        this.container.appendChild(toast);
        
        // CSSアニメーションの発火
        // 少し遅延させることで、DOMレンダリング後にクラスが付与されトランジションが効く
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });
        });
        
        // 4秒後に消去する
        setTimeout(() => {
            toast.classList.remove('show');
            setTimeout(() => {
                if(this.container.contains(toast)) {
                    this.container.removeChild(toast);
                }
            }, 500); // CSSのトランジション時間待つ
        }, 4000);
    }
}

// 次の出力（第2部）へ続くためのグローバルインスタンスの準備
const audio = new AudioEngine();
const input = new InputMgr();
const achievements = new AchievementMgr(audio);

// ----------------------------------------------------------------------------
// 6. TEXTURE GENERATOR (プロシージャル・テクスチャ生成エンジン)
// ----------------------------------------------------------------------------
class TextureGenerator {
    constructor() {
        this.textures = {};
        this.size = 64; // テクスチャの解像度 (64x64)
    }

    /** 必要なすべてのテクスチャを初期化・生成する */
    generateAll() {
        this.textures.wall = this._generateWallTexture();
        this.textures.floor = this._generateFloorTexture();
        this.textures.ceiling = this._generateCeilingTexture();
    }

    /** 壁のテクスチャ (サイバーパンク風のネオンライン) */
    _generateWallTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = this.size;
        canvas.height = this.size;
        const ctx = canvas.getContext('2d');

        // ベースカラー
        ctx.fillStyle = GAME_CONFIG.COLORS.WALL_BASE;
        ctx.fillRect(0, 0, this.size, this.size);

        // グリッドライン (ネオン風)
        ctx.strokeStyle = GAME_CONFIG.COLORS.WALL_LINE;
        ctx.lineWidth = 2;
        ctx.shadowColor = GAME_CONFIG.COLORS.WALL_LINE;
        ctx.shadowBlur = 8;

        ctx.beginPath();
        // 外枠
        ctx.rect(1, 1, this.size - 2, this.size - 2);
        // 中央の横線
        ctx.moveTo(0, this.size / 2);
        ctx.lineTo(this.size, this.size / 2);
        // 縦線
        ctx.moveTo(this.size / 2, 0);
        ctx.lineTo(this.size / 2, this.size);
        ctx.stroke();

        // ノイズ付与 (質感を出すため)
        const imgData = ctx.getImageData(0, 0, this.size, this.size);
        for (let i = 0; i < imgData.data.length; i += 4) {
            if (Math.random() < 0.05) {
                imgData.data[i] = Math.min(255, imgData.data[i] + 20);
                imgData.data[i+1] = Math.min(255, imgData.data[i+1] + 20);
                imgData.data[i+2] = Math.min(255, imgData.data[i+2] + 20);
            }
        }
        ctx.putImageData(imgData, 0, 0);
        return canvas;
    }

    /** 床のテクスチャ (暗いチェッカーボードに微細なノイズ) */
    _generateFloorTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = this.size;
        canvas.height = this.size;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = GAME_CONFIG.COLORS.FLOOR;
        ctx.fillRect(0, 0, this.size, this.size);

        ctx.fillStyle = '#111';
        ctx.fillRect(0, 0, this.size / 2, this.size / 2);
        ctx.fillRect(this.size / 2, this.size / 2, this.size / 2, this.size / 2);

        return canvas;
    }

    /** 天井のテクスチャ (完全な暗闇に近い) */
    _generateCeilingTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = this.size;
        canvas.height = this.size;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = GAME_CONFIG.COLORS.CEILING;
        ctx.fillRect(0, 0, this.size, this.size);

        return canvas;
    }
}

// 7. MAZE ENGINE (迷路生成・解析・A*用グラフ構築)
// ----------------------------------------------------------------------------
class MazeEngine {
    constructor(width, height) {
        // 迷路の幅と高さ (奇数である必要がある)
        this.width = width % 2 === 0 ? width + 1 : width;
        this.height = height % 2 === 0 ? height + 1 : height;
        this.grid = [];
        this.items = []; // ドットやパワーエサなどのアイテム配置
        this.totalDots = 0;
        this.spawnPoint = { x: 1, y: 1 };
        this.ghostHouse = { x: Math.floor(this.width / 2), y: Math.floor(this.height / 2) };
    }

    /** 完全な迷路を生成し、アイテムを配置するプロセスを実行 */
    buildLevel() {
        this._initGrid();
        this._digMaze(1, 1);
        this._ensureLoops();
        this._buildGhostHouse();
        this._placeItems();
    }

    /** グリッドを壁(1)で初期化 */
    _initGrid() {
        for (let y = 0; y < this.height; y++) {
            this.grid[y] = [];
            for (let x = 0; x < this.width; x++) {
                this.grid[y][x] = 1; // 1 = 壁
            }
        }
    }

    /** 穴掘り法 (Recursive Backtracker) によるベース迷路生成 */
    _digMaze(x, y) {
        this.grid[y][x] = 0; // 0 = 通路
        
        // 掘り進む方向をランダムにシャッフル
        const dirs = [
            { dx: 0, dy: -2 }, // 上
            { dx: 2, dy: 0 },  // 右
            { dx: 0, dy: 2 },  // 下
            { dx: -2, dy: 0 }  // 左
        ];
        dirs.sort(() => Math.random() - 0.5);

        for (const dir of dirs) {
            const nx = x + dir.dx;
            const ny = y + dir.dy;

            // 迷路の範囲内で、かつまだ壁である場合
            if (nx > 0 && nx < this.width - 1 && ny > 0 && ny < this.height - 1 && this.grid[ny][nx] === 1) {
                // 間の壁を壊す
                this.grid[y + dir.dy / 2][x + dir.dx / 2] = 0;
                // 次のセルへ再帰
                this._digMaze(nx, ny);
            }
        }
    }

    /** * ループ付与アルゴリズム:
     * 行き止まり(デッドエンド)を検出し、隣接する通路に壁を貫通させることで、
     * パックマンらしい回遊可能なマップを作成する。
     */

/** 行き止まり（周囲3方向が壁の通路）を見つける */
    _findDeadEnds() {
        const deadEnds = [];
        for (let y = 1; y < this.height - 1; y++) {
            for (let x = 1; x < this.width - 1; x++) {
                if (this.grid[y][x] === 0) {
                    let walls = 0;
                    if (this.grid[y - 1][x] === 1) walls++;
                    if (this.grid[y + 1][x] === 1) walls++;
                    if (this.grid[y][x - 1] === 1) walls++;
                    if (this.grid[y][x + 1] === 1) walls++;
                    if (walls >= 3) {
                        deadEnds.push({ x, y });
                    }
                }
            }
        }
        return deadEnds;
    }

    /** 指定した位置の行き止まりの壁を1つ壊して通路を繋ぐ */
    _breakWallAt(x, y) {
        const dirs = [
            { dx: 0, dy: -1 }, { dx: 1, dy: 0 },
            { dx: 0, dy: 1 }, { dx: -1, dy: 0 }
        ];
        dirs.sort(() => Math.random() - 0.5);

        for (const dir of dirs) {
            const nx = x + dir.dx;
            const ny = y + dir.dy;
            const nnx = nx + dir.dx;
            const nny = ny + dir.dy;

            if (nnx > 0 && nnx < this.width - 1 && nny > 0 && nny < this.height - 1) {
                if (this.grid[ny][nx] === 1 && this.grid[nny][nnx] === 0) {
                    this.grid[ny][nx] = 0;
                    return;
                }
            }
        }
    }

/** 広場を作らず、細い通路のループを維持するアルゴリズム */
    _ensureLoops() {
        let deadEnds;
        let protectionCounter = 0;
        
        // 1. 行き止まりを順次つなげていく（基本のループ形成）
        do {
            deadEnds = this._findDeadEnds();
            for (const cell of deadEnds) {
                this._breakWallAt(cell.x, cell.y);
            }
            protectionCounter++;
        } while (deadEnds.length > 0 && protectionCounter < 10);
        
        // 2. ★広場化の防止策: 
        // 2x2 以上の空間（広場）をスキャンして、見つけたら中心に壁を再設置する
        for (let y = 1; y < this.height - 2; y++) {
            for (let x = 1; x < this.width - 2; x++) {
                if (this.grid[y][x] === 0 && this.grid[y][x+1] === 0 &&
                    this.grid[y+1][x] === 0 && this.grid[y+1][x+1] === 0) {
                    
                    const rx = Math.random() > 0.5 ? 0 : 1;
                    const ry = Math.random() > 0.5 ? 0 : 1;
                    this.grid[y + ry][x + rx] = 1; 
                }
            }
        }

        // 3. ランダムな壁破壊を「極小」に制限（広場化の主因をカット）
        const extraBreaks = Math.floor((this.width * this.height) * 0.01);
        for(let i = 0; i < extraBreaks; i++) {
            const rx = MathUtils.randomInt(1, this.width - 2);
            const ry = MathUtils.randomInt(1, this.height - 2);
            if(this.grid[ry][rx] === 1) {
                const vertical = this.grid[ry-1][rx] === 0 && this.grid[ry+1][rx] === 0;
                const horizontal = this.grid[ry][rx-1] === 0 && this.grid[ry][rx+1] === 0;
                if((vertical && !horizontal) || (horizontal && !vertical)) {
                    this.grid[ry][rx] = 0;
                }
            }
        }
    }

/** マップ中央にゴーストハウスを生成し、通路への接続を保証する */
    _buildGhostHouse() {
        const cx = this.ghostHouse.x;
        const cy = this.ghostHouse.y;
        
        for(let y = cy - 1; y <= cy + 1; y++) {
            for(let x = cx - 1; x <= cx + 1; x++) {
                this.grid[y][x] = 0;
            }
        }
        
        // ゲート（ゴースト専用出口）
        this.grid[cy - 2][cx] = 2; 

        // ゲートの先が必ず通路に繋がるように、上の壁を強制的に壊す
        if (cy - 3 > 0) {
            this.grid[cy - 3][cx] = 0;
            this.grid[cy - 3][cx - 1] = 0;
            this.grid[cy - 3][cx + 1] = 0;
        }
    }

    /** ドットとパワーエサを通路に配置する */
    _placeItems() {
        this.items = [];
        this.totalDots = 0;
        const powerPelletSpots = [
            {x: 1, y: 1},
            {x: this.width - 2, y: 1},
            {x: 1, y: this.height - 2},
            {x: this.width - 2, y: this.height - 2}
        ];

        for (let y = 1; y < this.height - 1; y++) {
            for (let x = 1; x < this.width - 1; x++) {
                if (Math.abs(x - this.ghostHouse.x) <= 2 && Math.abs(y - this.ghostHouse.y) <= 2) continue;
                if (this.grid[y][x] === 0) {
                    if(MathUtils.distance(x, y, this.spawnPoint.x, this.spawnPoint.y) < 2) continue;
                    let isPower = false;
                    for(const spot of powerPelletSpots) {
                        if(Math.abs(x - spot.x) <= 1 && Math.abs(y - spot.y) <= 1) {
                            isPower = true;
                            powerPelletSpots.splice(powerPelletSpots.indexOf(spot), 1);
                            break;
                        }
                    }
                    const type = isPower ? 'POWER' : 'DOT';
                    this.items.push({
                        id: `item_${x}_${y}`,
                        gridX: x, gridY: y, type: type, active: true,
                        x: x * GAME_CONFIG.TILE_SIZE + GAME_CONFIG.TILE_SIZE / 2,
                        y: y * GAME_CONFIG.TILE_SIZE + GAME_CONFIG.TILE_SIZE / 2,
                        z: isPower ? GAME_CONFIG.TILE_SIZE * 0.4 : GAME_CONFIG.TILE_SIZE * 0.6
                    });
                    this.totalDots++;
                }
            }
        }
    }

  
    /** 指定座標が壁かどうか判定 */
    isWall(gridX, gridY) {
        if (gridX < 0 || gridX >= this.width || gridY < 0 || gridY >= this.height) return true;
        return this.grid[gridY][gridX] === 1;
    }
}

// 8. RENDERER (3D レイトレーシング＆UI描画エンジン)
// ----------------------------------------------------------------------------
class Renderer {
    constructor(mazeEngine) {
        this.maze = mazeEngine;
        this.mainCanvas = document.getElementById('main-canvas');
        this.ctx = this.mainCanvas.getContext('2d');
        this.radarCanvas = document.getElementById('radar-canvas');
        this.radarCtx = this.radarCanvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    /** 画面リサイズ時の処理：投影距離を高さ基準に固定して横伸びを防止 */
    resize() {
        const area = document.getElementById('view-area');
        if (!area) return;
        this.w = area.clientWidth;
        this.h = area.clientHeight;
        this.mainCanvas.width = this.w;
        this.mainCanvas.height = this.h;
        this.zBuffer = new Float32Array(this.w);
        
        this.radarCanvas.width = 120;
        this.radarCanvas.height = 120;

        // ★横長バグの修正：投影距離を「画面の高さ」に基づいて計算
        this.projDist = (this.h * 0.75) / Math.tan(GAME_CONFIG.FOV / 2);
    }

    render(player, entities) {
        // 前方描画のみ実行（HTMLに無い rearCanvas はエラーの元なので除外して正解です）
        this._drawFloorAndCeiling(this.ctx, this.w, this.h);
        this._castRays(player.x, player.y, player.angle, this.ctx, this.w, this.h, this.zBuffer);
        this._drawSprites(player, entities, this.ctx, this.w, this.h, this.zBuffer, player.angle);
        this._drawRadar(player, entities);
    }

    _drawFloorAndCeiling(ctx, w, h) {
        ctx.fillStyle = GAME_CONFIG.COLORS.CEILING;
        ctx.fillRect(0, 0, w, h / 2);
        const grad = ctx.createLinearGradient(0, h/2, 0, h);
        grad.addColorStop(0, '#000000');
        grad.addColorStop(1, GAME_CONFIG.COLORS.FLOOR);
        ctx.fillStyle = grad;
        ctx.fillRect(0, h / 2, w, h / 2);
    }

    _castRays(px, py, pa, ctx, cw, ch, zBuf) {
        const ts = GAME_CONFIG.TILE_SIZE;
        // ★修正：resizeで計算した正しい比率を使用
        const projDist = this.projDist;

        for (let i = 0; i < cw; i++) {
            const cameraX = 2 * i / cw - 1;
            const rayDirX = Math.cos(pa) + Math.cos(pa + Math.PI/2) * Math.tan(GAME_CONFIG.FOV/2) * cameraX;
            const rayDirY = Math.sin(pa) + Math.sin(pa + Math.PI/2) * Math.tan(GAME_CONFIG.FOV/2) * cameraX;
            let mapX = Math.floor(px / ts), mapY = Math.floor(py / ts);
            const deltaX = Math.abs(1 / rayDirX), deltaY = Math.abs(1 / rayDirY);
            let stepX, stepY, sideX, sideY;
            if (rayDirX < 0) { stepX = -1; sideX = (px/ts - mapX) * deltaX; } else { stepX = 1; sideX = (mapX + 1.0 - px/ts) * deltaX; }
            if (rayDirY < 0) { stepY = -1; sideY = (py/ts - mapY) * deltaY; } else { stepY = 1; sideY = (mapY + 1.0 - py/ts) * deltaY; }
            let hit = 0, side = 0;
            while (hit === 0) {
                if (sideX < sideY) { sideX += deltaX; mapX += stepX; side = 0; } else { sideY += deltaY; mapY += stepY; side = 1; }
                if (this.maze.isWall(mapX, mapY)) hit = 1;
            }
            const pdist = (side === 0 ? (mapX - px/ts + (1 - stepX)/2) / rayDirX : (mapY - py/ts + (1 - stepY)/2) / rayDirY) * ts;
            zBuf[i] = pdist;
            const lh = Math.floor((ts / pdist) * projDist);
            const b = Math.max(0, 1 - pdist / (GAME_CONFIG.MAX_DEPTH * ts));
            ctx.fillStyle = side === 1 ? `rgb(0,${20*b},${30*b})` : `rgb(0,${30*b},${45*b})`;
            ctx.fillRect(i, ch/2 - lh/2, 1, lh);
            
            if(pdist < GAME_CONFIG.MAX_DEPTH * ts) {
                ctx.fillStyle = `rgba(0, 255, 255, ${b * 0.8})`;
                ctx.fillRect(i, ch/2 - lh/2, 1, 2); 
                ctx.fillRect(i, ch/2 + lh/2 - 2, 1, 2);
            }
        }
    }

    _drawSprites(player, entities, ctx, cw, ch, zBuf, viewAngle) {
        const ts = GAME_CONFIG.TILE_SIZE;
        // ★修正：ここも正しい比率を使用
        const projDist = this.projDist;

        const sprites = entities.filter(e => e.active).map(e => {
            const dx = e.x - player.x, dy = e.y - player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            let a = Math.atan2(dy, dx) - viewAngle;
            while (a < -Math.PI) a += Math.PI * 2; while (a >= Math.PI) a -= Math.PI * 2;
            return { e, dist, a };
        }).filter(s => s.dist < GAME_CONFIG.MAX_DEPTH * ts && Math.abs(s.a) < GAME_CONFIG.FOV);
        
        sprites.sort((a, b) => b.dist - a.dist);
        
        for (const s of sprites) {
            const cosA = Math.cos(s.a); if (cosA <= 0) continue;
            const dist = s.dist * cosA;
            const sx = (cw / 2) + Math.tan(s.a) * projDist;
            if (sx < 0 || sx >= cw || dist >= zBuf[Math.floor(sx)]) continue;
            const size = (ts / dist) * projDist;
            const ds = size * (s.e.type === 'DOT' ? 0.2 : s.e.type === 'POWER' ? 0.4 : 0.8);
            const b = Math.max(0, 1 - dist / (GAME_CONFIG.MAX_DEPTH * ts));
            ctx.globalAlpha = b * 0.8;
            const cy = ch / 2;
            
            if (s.e.type === 'DOT' || s.e.type === 'POWER') {
                const dotY = cy + (size * 0.35);
                ctx.fillStyle = s.e.type === 'POWER' ? GAME_CONFIG.COLORS.POWER_PELLET : GAME_CONFIG.COLORS.DOT;
                ctx.beginPath(); ctx.arc(sx, dotY, ds/2, 0, Math.PI*2); ctx.fill();
            } else if (s.e.type.startsWith('GHOST')) {
                ctx.fillStyle = s.e.state === 'SCARED' ? '#00f' : s.e.color;
                ctx.beginPath(); ctx.arc(sx, cy - ds/4, ds/2, Math.PI, 0); ctx.lineTo(sx + ds/2, cy + ds/2);
                for(let i=0; i<=3; i++) ctx.lineTo(sx + ds/2 - (ds/3)*i, cy + ds/2 - (i%2===0 ? 0 : ds/4));
                ctx.lineTo(sx - ds/2, cy + ds/2); ctx.fill();
            }
            ctx.globalAlpha = 1.0;
        }
    
            else if (s.e.type.startsWith('GHOST')) {
                // ゴーストのディテール復元
                ctx.fillStyle = s.e.state === 'SCARED' ? '#00f' : s.e.color;
                ctx.beginPath();
                ctx.arc(sx, cy - ds/4, ds/2, Math.PI, 0);
                ctx.lineTo(sx + ds/2, cy + ds/2);
                for(let i=0; i<=3; i++) {
                    const wx = sx + ds/2 - (ds/3)*i;
                    const wy = cy + ds/2 - (i%2===0 ? 0 : ds/4);
                    ctx.lineTo(wx, wy);
                }
                ctx.lineTo(sx - ds/2, cy + ds/2); ctx.fill();
                if (s.e.state !== 'SCARED') {
                    ctx.fillStyle = '#fff';
                    ctx.beginPath(); ctx.arc(sx - ds/5, cy - ds/4, ds/6, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(sx + ds/5, cy - ds/4, ds/6, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#00f';
                    ctx.beginPath(); ctx.arc(sx - ds/5, cy - ds/4, ds/12, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(sx + ds/5, cy - ds/4, ds/12, 0, Math.PI*2); ctx.fill();
                }
            } else if (s.e.type === 'PARTICLE') {
                ctx.fillStyle = s.e.color; ctx.globalAlpha = s.e.life * b;
                ctx.fillRect(sx - s.e.size/2, cy - s.e.size/2, s.e.size, s.e.size);
            }
            ctx.globalAlpha = 1.0;
        }
    }
/** 画面リサイズ時の処理：各キャンバスの解像度を決定する */
resize() {
        const area = document.getElementById('view-area');
        if (!area) return;
        this.w = area.clientWidth;
        this.h = area.clientHeight;
        this.mainCanvas.width = this.w;
        this.mainCanvas.height = this.h;
        this.zBuffer = new Float32Array(this.w);
        
        this.radarCanvas.width = 120;
        this.radarCanvas.height = 120;

        // ★修正：投影距離を「画面の高さ」に基づいて計算するように変更
        // これにより、縦長画面でも廊下やドットが横に潰れなくなります
        this.projDist = (this.h / 1.5) / Math.tan(GAME_CONFIG.FOV / 2);
    }
    /** 描画のメイン処理 */
    render(player, entities) {
        // 前方描画
        this._drawFloorAndCeiling(this.ctx, this.w, this.h);
        this._castRays(player.x, player.y, player.angle, this.ctx, this.w, this.h, this.zBuffer);
        this._drawSprites(player, entities, this.ctx, this.w, this.h, this.zBuffer, player.angle);
        
        // レーダー（マップ）の描画
        this._drawRadar(player, entities);

        // 後方カメラの描画
        const rw = this.rearCanvas.width;
        const rh = this.rearCanvas.height;
        const rz = new Float32Array(rw);
        const rearAngle = MathUtils.normalizeAngle(player.angle + Math.PI);
        this._drawFloorAndCeiling(this.rearCtx, rw, rh);
        this._castRays(player.x, player.y, rearAngle, this.rearCtx, rw, rh, rz);
        this._drawSprites(player, entities, this.rearCtx, rw, rh, rz, rearAngle);
    }

    // --- (途中、_drawFloorAndCeiling / _castRays / _drawSprites はそのまま残してください) ---

    /** UI: プロキシミティ・レーダーの歪み修正版 (内部解像度に合わせる) */
    _drawRadar(player, entities) {
        const ctx = this.radarCtx;
        const w = this.radarCanvas.width; // 180
        const h = this.radarCanvas.height; // 180
        const ts = GAME_CONFIG.TILE_SIZE;
        ctx.clearRect(0, 0, w, h);
        
        // 縦横共通のスケールを使用
        const scale = 15; 
        const offX = (w / 2) - (player.x / ts) * scale;
        const offY = (h / 2) - (player.y / ts) * scale;

        // 壁の描画
        ctx.fillStyle = 'rgba(0, 255, 255, 0.4)';
        for (let y = 0; y < this.maze.height; y++) {
            for (let x = 0; x < this.maze.width; x++) {
                if (this.maze.grid[y][x] === 1) {
                    const dx = offX + x * scale;
                    const dy = offY + y * scale;
                    // キャンバスの範囲内のみ描画
                    if (dx > -scale && dx < w && dy > -scale && dy < h) {
                        ctx.fillRect(dx, dy, scale + 0.5, scale + 0.5);
                    }
                }
            }
        }

        // ゴーストの描画
        entities.forEach(e => {
            if (!e.active || !e.type.startsWith('GHOST')) return;
            const gx = offX + (e.x / ts) * scale;
            const gy = offY + (e.y / ts) * scale;
            if (gx > 0 && gx < w && gy > 0 && gy < h) {
                ctx.fillStyle = e.state === 'SCARED' ? '#00f' : '#f00';
                ctx.beginPath(); 
                ctx.arc(gx, gy, 4, 0, Math.PI * 2); 
                ctx.fill();
            }
        });

        // プレイヤーの描画 (中央に固定)
        ctx.save();
        ctx.translate(w / 2, h / 2);
        ctx.rotate(player.angle);
        ctx.fillStyle = '#0f0';
        ctx.beginPath();
        ctx.moveTo(8, 0); 
        ctx.lineTo(-6, -5); 
        ctx.lineTo(-6, 5);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
}

// 9. MATH & GEOMETRY KERNEL (ステルスAI用のベクトル演算ライブラリ)
// ----------------------------------------------------------------------------
class Vector2 {
    constructor(x = 0, y = 0) {
        this.x = x;
        this.y = y;
    }
    set(x, y) {
        this.x = x;
        this.y = y;
        return this;
    }
    copy() {
        return new Vector2(this.x, this.y);
    }
    add(v) {
        this.x += v.x;
        this.y += v.y;
        return this;
    }
    sub(v) {
        this.x -= v.x;
        this.y -= v.y;
        return this;
    }
    multiplyScalar(s) {
        this.x *= s;
        this.y *= s;
        return this;
    }
    magnitude() {
        return Math.sqrt(this.x * this.x + this.y * this.y);
    }
    normalize() {
        const mag = this.magnitude();
        if (mag !== 0) {
            this.x /= mag;
            this.y /= mag;
        }
        return this;
    }
    dot(v) {
        return this.x * v.x + this.y * v.y;
    }
    distanceTo(v) {
        const dx = this.x - v.x;
        const dy = this.y - v.y;
        return Math.sqrt(dx * dx + dy * dy);
    }
    angle() {
        return Math.atan2(this.y, this.x);
    }
    static subtract(v1, v2) {
        return new Vector2(v1.x - v2.x, v1.y - v2.y);
    }
}

// 10. ADVANCED PATHFINDING ENGINE (優先度付きキューとA*アルゴリズム)
// ----------------------------------------------------------------------------
class PriorityQueue {
    constructor() {
        this.elements = [];
    }
    isEmpty() {
        return this.elements.length === 0;
    }
    enqueue(element, priority) {
        const qElement = { element, priority };
        let added = false;
        for (let i = 0; i < this.elements.length; i++) {
            if (this.elements[i].priority > qElement.priority) {
                this.elements.splice(i, 0, qElement);
                added = true;
                break;
            }
        }
        if (!added) {
            this.elements.push(qElement);
        }
    }
    dequeue() {
        if (this.isEmpty()) return null;
        return this.elements.shift().element;
    }
}

class Pathfinder {
    static getPath(maze, startGridX, startGridY, targetGridX, targetGridY) {
        if (startGridX === targetGridX && startGridY === targetGridY) return [];
        
        let tx = targetGridX;
        let ty = targetGridY;
        
        if (maze.isWall(tx, ty)) {
            const fallback = this._findNearestWalkable(maze, tx, ty);
            if (!fallback) return [];
            tx = fallback.x;
            ty = fallback.y;
        }

        const frontier = new PriorityQueue();
        frontier.enqueue(new Vector2(startGridX, startGridY), 0);
        
        const cameFrom = new Map();
        const costSoFar = new Map();
        
        const startKey = `${startGridX},${startGridY}`;
        cameFrom.set(startKey, null);
        costSoFar.set(startKey, 0);

        const dirs = [
            new Vector2(1, 0), new Vector2(-1, 0),
            new Vector2(0, 1), new Vector2(0, -1)
        ];

        let iterations = 0;
        const maxIter = 800; 

        while (!frontier.isEmpty() && iterations < maxIter) {
            iterations++;
            const current = frontier.dequeue();
            
            if (current.x === tx && current.y === ty) {
                break;
            }

            const currentKey = `${current.x},${current.y}`;

            for (let i = 0; i < dirs.length; i++) {
                const next = new Vector2(current.x + dirs[i].x, current.y + dirs[i].y);
                const nextKey = `${next.x},${next.y}`;
                
                if (maze.isWall(next.x, next.y)) continue;

                const newCost = costSoFar.get(currentKey) + 1;
                
                if (!costSoFar.has(nextKey) || newCost < costSoFar.get(nextKey)) {
                    costSoFar.set(nextKey, newCost);
                    const priority = newCost + this._heuristic(next.x, next.y, tx, ty);
                    frontier.enqueue(next, priority);
                    cameFrom.set(nextKey, current);
                }
            }
        }

        let current = new Vector2(tx, ty);
        const path = [];
        let currKey = `${current.x},${current.y}`;
        
        if (!cameFrom.has(currKey)) return []; 

        while (current !== null) {
            path.push({ x: current.x, y: current.y });
            current = cameFrom.get(currKey);
            if (current) currKey = `${current.x},${current.y}`;
        }
        
        path.reverse();
        path.shift(); 
        return path;
    }

    static _heuristic(x1, y1, x2, y2) {
        return Math.abs(x1 - x2) + Math.abs(y1 - y2);
    }

    static _findNearestWalkable(maze, x, y) {
        let maxRadius = 5;
        for (let r = 1; r <= maxRadius; r++) {
            for (let i = -r; i <= r; i++) {
                for (let j = -r; j <= r; j++) {
                    if (Math.abs(i) === r || Math.abs(j) === r) {
                        const nx = x + i;
                        const ny = y + j;
                        if (!maze.isWall(nx, ny)) {
                            return { x: nx, y: ny };
                        }
                    }
                }
            }
        }
        return null;
    }
}

// ----------------------------------------------------------------------------
// 11. DYNAMIC UI MANAGER (頭上の「！」マーク等の3D空間投影マネージャー)
// ----------------------------------------------------------------------------
class FloatingUIManager {
    constructor() {
        this.container = document.createElement('div');
        this.container.id = 'floating-ui-container';
        this.container.style.position = 'absolute';
        this.container.style.top = '0';
        this.container.style.left = '0';
        this.container.style.width = '100%';
        this.container.style.height = '100%';
        this.container.style.pointerEvents = 'none';
        this.container.style.zIndex = '30';
        document.getElementById('game-container').appendChild(this.container);
        
        this.markers = new Map(); 
    }

    update(player, ghosts, canvasWidth, canvasHeight, projDistance) {
        const fov = GAME_CONFIG.FOV;

        ghosts.forEach(ghost => {
            if (!ghost.active) return;

            let markerState = null;
            let markerColor = '#fff';
            let markerText = '';
            
            if (ghost.state === 'CHASE') {
                markerState = 'alert';
                markerColor = '#ff0000';
                markerText = '!';
            } else if (ghost.state === 'INVESTIGATE') {
                markerState = 'question';
                markerColor = '#ffff00';
                markerText = '?';
            } else if (ghost.state === 'SCARED') {
                markerState = 'scared';
                markerColor = '#00ffff';
                markerText = '〰';
            }

            if (!markerState) {
                if (this.markers.has(ghost.id)) {
                    const el = this.markers.get(ghost.id);
                    el.style.opacity = '0';
                }
                return;
            }

            const dx = ghost.x - player.x;
            const dy = ghost.y - player.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist > GAME_CONFIG.MAX_DEPTH * GAME_CONFIG.TILE_SIZE) {
                if (this.markers.has(ghost.id)) this.markers.get(ghost.id).style.opacity = '0';
                return;
            }

            let angleToGhost = Math.atan2(dy, dx) - player.angle;
            while (angleToGhost < -Math.PI) angleToGhost += 2 * Math.PI;
            while (angleToGhost >= Math.PI) angleToGhost -= 2 * Math.PI;

            let markerEl = this.markers.get(ghost.id);
            if (!markerEl) {
                markerEl = document.createElement('div');
                markerEl.style.position = 'absolute';
                markerEl.style.fontWeight = 'bold';
                markerEl.style.fontFamily = 'monospace';
                markerEl.style.transition = 'opacity 0.2s';
                markerEl.style.textShadow = '0 0 10px currentColor, 0 0 20px currentColor';
                this.container.appendChild(markerEl);
                this.markers.set(ghost.id, markerEl);
            }

            if (Math.abs(angleToGhost) < (fov / 2) + 0.5) {
                const correctedDist = dist * Math.cos(angleToGhost);
                if (correctedDist <= 0.1) return;

                const screenX = Math.tan(angleToGhost) * projDistance;
                const cx = (canvasWidth / 2) + screenX;
                
                const ts = GAME_CONFIG.TILE_SIZE;
                const zOffset = ((ts / 2) - ghost.z - (ts * 0.8)) / correctedDist * projDistance;
                const cy = (canvasHeight / 2) + zOffset;

                const baseFontSize = 4000; 
                let fontSize = baseFontSize / correctedDist;
                fontSize = Math.max(10, Math.min(80, fontSize));

                markerEl.textContent = markerText;
                markerEl.style.color = markerColor;
                markerEl.style.fontSize = `${fontSize}px`;
                markerEl.style.left = `${cx}px`;
                markerEl.style.top = `${cy}px`;
                markerEl.style.transform = `translate(-50%, -100%)`;
                markerEl.style.opacity = '1';
                
                if (markerState === 'alert') {
                    markerEl.style.animation = 'pulse 0.5s infinite alternate';
                } else {
                    markerEl.style.animation = 'none';
                }
            } else {
                markerEl.style.opacity = '0';
            }
        });
    }
}
